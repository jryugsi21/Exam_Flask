name: Build and Push to GHCR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/flask-app:1.0.0 ./app
          docker tag ghcr.io/${{ github.repository_owner }}/flask-app:1.0.0 ghcr.io/${{ github.repository_owner }}/flask-app:latest

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/flask-app:1.0.0
          docker push ghcr.io/${{ github.repository_owner }}/flask-app:latest