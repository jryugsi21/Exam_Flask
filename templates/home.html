<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">{{ app_name }}</a>
            <div class="d-flex">
                <a href="/productos" class="btn btn-outline-light btn-sm">Ver Productos</a>
            </div>
        </div>
    </nav>

    <div class="container text-center mt-5">
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
            <h1 class="display-5 mb-3 text-primary">{{ app_name }}</h1>
            <p class="text-muted">Versión del sistema: <strong>{{ version }}</strong></p>

            <hr>

            <h5 class="mt-3">Estado de la Infraestructura:</h5>
            <div class="alert alert-{{ alert_class }} mt-2" role="alert">
                <strong>Base de Datos:</strong> {{ status }}
            </div>

            <div class="d-grid gap-2 mt-4">
                <a href="/productos" class="btn btn-primary">Ir al Inventario de Productos</a>
            </div>
        </div>
    </div>

</body>
</html>
